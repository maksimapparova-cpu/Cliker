<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>НЕОН КЛИКЕР · Онлайн</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: #0a0a1a; min-height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; color: white; }
        #particleCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        .screen { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; max-width: 360px; padding: 16px; z-index: 20; gap: 14px; }
        .screen.active { display: flex; }
        
        /* Авторизация */
        .auth-box { display: flex; flex-direction: column; gap: 12px; width: 100%; background: rgba(10, 5, 25, 0.8); padding: 24px; border-radius: 20px; border: 1px solid #0ff; box-shadow: 0 0 20px rgba(0, 255, 255, 0.3); }
        .auth-box h2 { text-align: center; margin-bottom: 10px; text-shadow: 0 0 10px #0ff; }
        .auth-box input { padding: 12px; border-radius: 10px; background: rgba(0,0,0,0.5); border: 1px solid #f0f; color: white; outline: none; font-size: 1rem; }
        .auth-box input:focus { border-color: #0ff; box-shadow: 0 0 10px #0ff; }
        .auth-btn { padding: 12px; border-radius: 10px; background: linear-gradient(135deg, #0ff, #00aaff); border: none; font-weight: bold; font-size: 1rem; cursor: pointer; text-transform: uppercase; color: #000; }
        .auth-switch { text-align: center; font-size: 0.8rem; margin-top: 10px; color: #aaa; cursor: pointer; }
        .auth-switch span { color: #f0f; text-decoration: underline; }

        /* Меню и игра */
        .menu { display: flex; gap: 5px; padding: 8px 10px; background: rgba(10, 5, 25, 0.7); border: 1px solid rgba(0, 255, 255, 0.3); border-radius: 40px; flex-wrap: wrap; justify-content: center; width: 100%; }
        .menu-btn { background: transparent; border: none; color: #a0f0ff; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; padding: 5px 6px; cursor: pointer; text-shadow: 0 0 6px cyan; }
        .menu-btn.admin { color: #ff3366; text-shadow: 0 0 6px #ff3366; }
        .score-panel { font-size: 2.4rem; font-weight: 800; text-shadow: 0 0 8px #0ff, 0 0 18px #0ff; background: rgba(0, 20, 30, 0.5); padding: 0 22px; border-radius: 50px; border: 1px solid rgba(0, 255, 255, 0.5); }
        .clicker-btn { width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #00ffff, #0066cc, #220044); border: 3px solid #0ff; box-shadow: 0 0 22px #0ff, 0 0 50px #00aaff; cursor: pointer; font-size: 1.3rem; font-weight: 900; color: white; display: flex; justify-content: center; align-items: center; outline: none; transition: 0.1s; }
        .clicker-btn:active { transform: scale(0.92); }
        
        /* Улучшения */
        .upgrade-panel { padding: 10px 16px; background: rgba(10, 5, 25, 0.8); border: 1px solid rgba(255, 0, 255, 0.35); border-radius: 18px; display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
        .upgrade-btn { width: 100%; padding: 10px; font-size: 0.8rem; font-weight: 700; color: #fff; background: linear-gradient(135deg, #2a0a3a, #0a1a3a); border: 2px solid #f0f; border-radius: 40px; cursor: pointer; }
        .upgrade-btn:disabled { opacity: 0.5; cursor: not-allowed; border-color: #555; }
        .progress-bar-wrap { width: 100%; height: 6px; background: rgba(0, 0, 0, 0.6); border-radius: 10px; overflow: hidden; border: 1px solid rgba(0, 255, 255, 0.25); }
        .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #0ff, #f0f, #0ff); transition: width 0.3s; }
        .level-badge { font-size: 0.7rem; color: #f0f; text-transform: uppercase; }
        .rank-badge { font-size: 0.75rem; color: #ffd700; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; text-shadow: 0 0 8px rgba(255, 215, 0, 0.6); }
        
        /* Пассивный доход и таймер сброса */
        .passive-panel { padding: 10px 16px; background: rgba(10, 5, 25, 0.8); border: 1px solid rgba(0, 255, 255, 0.35); border-radius: 18px; display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
        .passive-btn { width: 100%; padding: 10px; font-size: 0.8rem; font-weight: 700; color: #fff; background: linear-gradient(135deg, #0a2a3a, #0a3a2a); border: 2px solid #0ff; border-radius: 40px; cursor: pointer; }
        .passive-btn:disabled { opacity: 0.5; cursor: not-allowed; border-color: #555; }
        
        .reset-timer { font-size: 0.75rem; color: #ff3366; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; margin-top: 5px; text-shadow: 0 0 5px rgba(255, 51, 102, 0.5); }

        /* Магазин, Лидеры, Друзья, Поддержка, Админка */
        .shop-box, .leaderboard-box, .friends-box, .support-box, .admin-box { width: 100%; background: rgba(10, 5, 25, 0.9); padding: 20px; border-radius: 20px; border: 1px solid #0ff; display: flex; flex-direction: column; gap: 10px; max-height: 85vh; }
        .admin-box { border-color: #ff3366; }
        .shop-box h3, .leaderboard-box h3, .friends-box h3, .support-box h3, .admin-box h3 { text-align: center; color: #0ff; text-shadow:0 0 10px #0ff; margin-bottom: 10px; }
        .admin-box h3 { color: #ff3366; text-shadow: 0 0 10px #ff3366; }
        
        .shop-list, .leader-list, .friends-list, .admin-list { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; padding-right: 5px; }
        
        /* Вкладки магазина */
        .shop-tabs { 
            display: flex; 
            flex-wrap: wrap;
            gap: 8px; 
            padding: 5px 0 10px 0; 
            margin-bottom: 10px; 
            border-bottom: 1px solid rgba(0,255,255,0.2); 
            justify-content: center; 
        }
        .shop-tab { 
            padding: 6px 10px; 
            background: rgba(255,255,255,0.1); 
            color: #fff; 
            border: 1px solid transparent; 
            border-radius: 10px; 
            cursor: pointer; 
            font-size: 0.75rem; 
            transition: 0.2s; 
        }
        .shop-tab.active { 
            background: #0ff; 
            color: #000; 
            font-weight: bold; 
            border-color: #0ff; 
        }

        .shop-category { font-size: 0.8rem; color: #ffd700; text-transform: uppercase; margin: 10px 0 5px 0; font-weight: bold; text-align: left; width: 100%; }
        
        .shop-item, .friend-item, .admin-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); font-size: 0.9rem; }
        .admin-item { border-color: rgba(255, 51, 102, 0.3); flex-direction: column; align-items: flex-start; gap: 8px; }
        .shop-item .preview { font-size: 1.5rem; margin-right: 10px; }
        .buy-btn, .action-btn { padding: 6px 12px; border-radius: 10px; background: #0ff; color: #000; font-weight: bold; border: none; cursor: pointer; white-space: nowrap; font-size: 0.75rem; }
        .buy-btn:disabled, .action-btn:disabled { background: #555; color: #aaa; cursor: not-allowed; }
        .action-btn.danger { background: #ff3366; color: white; }
        .action-btn.success { background: #00ff00; color: #000; }
        .action-btn.warning { background: #ffaa00; color: #000; }
        
        .leader-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 0.9rem; cursor: pointer; transition: 0.2s; border-radius: 8px; }
        .leader-item:hover { background: rgba(255,255,255,0.1); }
        .leader-item.self { background: rgba(0, 255, 255, 0.1); color: #0ff; }
        
        /* Кнопка обновления лидеров */
        .refresh-btn { padding: 8px 15px; background: rgba(0, 255, 255, 0.1); color: #0ff; border: 1px solid #0ff; border-radius: 15px; cursor: pointer; font-size: 0.8rem; align-self: center; margin-bottom: 10px; font-weight: bold; transition: 0.2s; }
        .refresh-btn:hover { background: rgba(0, 255, 255, 0.3); }

        .close-btn { margin-top: 15px; padding: 10px; width: 100%; background: transparent; border: 1px solid #0ff; color: #0ff; border-radius: 20px; cursor: pointer; text-transform: uppercase; }
        .admin-box .close-btn { border-color: #ff3366; color: #ff3366; }

        /* Поддержка */
        .support-box textarea { width: 100%; padding: 10px; border-radius: 10px; background: rgba(0,0,0,0.5); border: 1px solid #f0f; color: white; outline: none; resize: none; height: 80px; font-size: 0.9rem; }
        .support-box .ticket-item { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 8px; font-size: 0.8rem; }
        .support-box .ticket-reply { background: rgba(0,255,255,0.1); padding: 8px; border-radius: 8px; margin-top: 5px; border-left: 2px solid #0ff; }

        /* Чат друзей */
        .chat-box { width: 100%; background: rgba(10, 5, 25, 0.9); padding: 20px; border-radius: 20px; border: 1px solid #0ff; display: flex; flex-direction: column; gap: 10px; max-height: 85vh; }
        .chat-box h3 { text-align: center; color: #0ff; text-shadow:0 0 10px #0ff; margin-bottom: 10px; }
        .chat-messages { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; flex-grow: 1; padding-right: 5px; min-height: 200px; max-height: 50vh; }
        .chat-msg { padding: 8px 12px; border-radius: 10px; font-size: 0.85rem; max-width: 80%; line-height: 1.3; }
        .chat-msg.self { align-self: flex-end; background: rgba(0, 255, 255, 0.2); border: 1px solid #0ff; }
        .chat-msg.other { align-self: flex-start; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); }
        .chat-input-area { display: flex; gap: 5px; margin-top: 10px; }
        .chat-input-area input { flex: 1; padding: 10px; border-radius: 10px; background: rgba(0,0,0,0.5); border: 1px solid #0ff; color: white; outline: none; }

        /* Профиль игрока */
        .profile-box { 
            width: 100%; 
            background: rgba(10, 5, 25, 0.9); 
            padding: 50px 20px 20px 20px; 
            border-radius: 20px; 
            border: 2px solid #0ff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 10px; 
            position: relative; 
            overflow: visible; 
            margin-top: 20px;
        }
        .profile-banner { position: absolute; top: 0; left: 0; width: 100%; height: 90px; z-index: 0; border-radius: 18px 18px 0 0; }
        
        /* Верхний бейдж рамки */
        .frame-badge {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 50px;
            background: #0a0a1a;
            border: 3px solid #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            z-index: 5;
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
            display: none;
        }

        .profile-avatar { font-size: 4rem; z-index: 1; margin-top: 30px; text-shadow: 0 0 10px #0ff; }
        
        .profile-name-wrapper { display: flex; align-items: center; gap: 5px; z-index: 1; margin-top: 5px; }
        .profile-name { font-size: 1.5rem; font-weight: bold; text-shadow: 0 0 10px #fff; }
        .profile-pin { font-size: 1.5rem; text-shadow: 0 0 10px #0ff; } 
        
        .profile-rank { font-size: 0.9rem; color: #ffd700; z-index: 1; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 10px; }
        .profile-stats { display: flex; gap: 15px; z-index: 1; background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 20px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.1); }

        /* --- РАМКИ ДЛЯ ВСЕГО ПРОФИЛЯ --- */

        .rainbow-text { background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff, #ff0000); background-size: 200% auto; color: transparent; -webkit-background-clip: text; background-clip: text; animation: rainbow-anim 3s linear infinite; }

        async function checkGiftLink() {
            const urlParams = new URLSearchParams(window.location.search);
            const giftId = urlParams.get('gift');

            if (giftId && allGifts[giftId]) {
                window.history.replaceState({}, document.title, window.location.pathname);

                if (userData.usedGifts && userData.usedGifts.includes(giftId)) {
                    alert('❌ Вы уже активировали этот подарок!');
                    return;
                }

                const gift = allGifts[giftId];
                let successMessage = '';

                if (gift.type === 'clicks') {
                    userData.score += gift.amount;
                    successMessage = `🎁 Подарок активирован! Вы получили ${gift.amount} кликов!`;
                } else if (gift.type === 'avatar' || gift.type === 'frame' || gift.type === 'banner' || gift.type === 'pin') {
                    if (!userData.inventory.includes(gift.itemId)) {
                        userData.inventory.push(gift.itemId);
                        successMessage = `🎁 Подарок активирован! Вы получили "${gift.name}"!`;
                    } else {
                        successMessage = `🎁 Вы уже имеете "${gift.name}", но подарок засчитан!`;
                    }
                }

                if (!userData.usedGifts) userData.usedGifts = [];
                userData.usedGifts.push(giftId);

                updateUI();
                saveToCloud(true);
                setTimeout(() => alert(successMessage), 500);
            }
        }

        // --- ЛОГИКА БОКСОВ ---
        function openLootBox() {
            if (!currentUser || userData.score < BOX_COST) {
                alert('Недостаточно кликов для покупки бокса!');
                return;
            }

            userData.score -= BOX_COST;

            const totalChance = lootBoxPool.reduce((sum, item) => sum + item.chance, 0);
            let random = Math.random() * totalChance;
            let selectedItem = null;

            for (const item of lootBoxPool) {
                if (random < item.chance) {
                    selectedItem = item;
                    break;
                }
                random -= item.chance;
            }

            if (!selectedItem) selectedItem = lootBoxPool[0];

            let dropMessage = `🎁 Бокс открыт!\n\nВам выпало: ${selectedItem.name}`;

            if (selectedItem.type === 'clicks') {
                userData.score += selectedItem.amount;
            } else {
                if (!userData.inventory.includes(selectedItem.itemId)) {
                    userData.inventory.push(selectedItem.itemId);
                } else {
                    dropMessage += '\n\n(У вас уже есть этот предмет, но он добавлен в инвентарь)';
                }
            }

            updateUI();
            saveToCloud(true);
            renderShopItems();
            createParticles(window.innerWidth / 2, window.innerHeight / 2, 50, true);
            
            setTimeout(() => {
                alert(dropMessage);
            }, 300);
        }

        // --- Таймер до сброса ---
        function updateResetTimer() {
            if (resetTimerInterval) clearInterval(resetTimerInterval);
            
            resetTimerInterval = setInterval(() => {
                if (!userData.lastResetTime) return;
                
                const TWO_WEEKS = 14 * 24 * 60 * 60 * 1000;
                const now = Date.now();
                const timeLeft = (userData.lastResetTime + TWO_WEEKS) - now;

                if (timeLeft <= 0) {
                    resetTimerDisplay.textContent = "Сброс сейчас!";
                    clearInterval(resetTimerInterval);
                    checkSeasonReset(); 
                    return;
                }

                const days = Math.floor(timeLeft / (1000 * 60 * 60 * 24));
                const hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
                
                resetTimerDisplay.textContent = `До сброса: ${days} д. ${hours} ч. ${minutes} мин.`;
            }, 1000);
        }

        // --- Логика сезонного сброса ---
        async function checkSeasonReset() {
            const TWO_WEEKS = 14 * 24 * 60 * 60 * 1000;
            const now = Date.now();

            if (now - userData.lastResetTime > TWO_WEEKS) {
                userData.score = 0;
                userData.level = 1;
                userData.clicksPerClick = 1;
                userData.upgradeCost = 4;
                userData.passiveMultiplier = 1;
                userData.passiveUpgradeCost = 10;
                userData.lastResetTime = now;

                try {
                    await updateDoc(doc(db, "users", currentUser.uid), {
                        score: 0, level: 1, clicksPerClick: 1, upgradeCost: 4,
                        passiveMultiplier: 1, passiveUpgradeCost: 10,
                        lastResetTime: now
                    });
                    setTimeout(() => {
                        alert("🎉 НОВЫЙ СЕЗОН! Клики, уровни и пассивный доход сброшены. Но ваши титулы, рамки, цвета и инвентарь остались с вами!");
                    }, 1000);
                } catch (e) {
                    console.error("Ошибка сброса сезона:", e);
                }
            }
        }

        function calculateOfflineIncome() {
            const now = Date.now();
            const offlineTimeMs = now - userData.lastLogoutTime;
            const OFFLINE_LIMIT_MS = 24 * 60 * 60 * 1000;
            const timeToCount = Math.min(offlineTimeMs, OFFLINE_LIMIT_MS);

            if (timeToCount > 10000) {
                const incomePer2Sec = userData.level * userData.passiveMultiplier;
                const periods = Math.floor(timeToCount / 2000);
                const offlineIncome = periods * incomePer2Sec;

                if (offlineIncome > 0) {
                    userData.score += offlineIncome;
                    setTimeout(() => {
                        alert(`С возвращением! Пока вас не было, вы заработали: ${offlineIncome} кликов.`);
                    }, 500);
                }
            }
            userData.lastLogoutTime = now;
        }

                    chatMessages.innerHTML = '<div style="text-align:center; color:#aaa;">Сообщений пока нет. Напишите первым!</div>';

                        div.className = `chat-msg ${msg.sender === currentUser.uid ? 'self' : 'other'}`;

                        chatMessages.appendChild(div);

                    chatMessages.scrollTop = chatMessages.scrollHeight;

                                userData.customFrame = item.className;
                                updateUI(); saveToCloud(true); renderShopItems();
                            } else if (userData.score >= item.price) { 
                                userData.score -= item.price; userData.inventory.push(item.id); userData.customFrame = item.className; 
                                updateUI(); saveToCloud(true); renderShopItems(); createParticles(window.innerWidth/2, window.innerHeight/2, 30); 
                            } else alert('Недостаточно кликов!'); 
                        }
                    };
                    shopList.appendChild(div);
                });
            }

            else if (currentShopCategory === 'color') {
                allColors.forEach(item => {
                    const isOwned = userData.inventory.includes(item.id);
                    const isEquipped = userData.customColor === item.className;
                    const div = document.createElement('div'); div.className = 'shop-item';
                    div.innerHTML = `<div style="display:flex; align-items:center;"><span class="preview ${item.className}" style="font-weight:bold; font-size:1.2rem; width:35px; height:35px; display:flex; align-items:center; justify-content:center;">Aa</span><div style="margin-left: 10px;"><div style="font-weight:bold; color:#fff">${item.name}</div><div style="font-size:0.7rem; color:#aaa;">${isOwned ? 'Куплено' : 'Цена: ' + item.price}</div></div></div><button class="buy-btn" ${isEquipped ? 'disabled' : ''}>${isEquipped ? 'Надето' : (isOwned ? 'Надеть' : 'Купить')}</button>`;
                    const btn = div.querySelector('button');
                    btn.onclick = () => {
                        if (isEquipped) return;
                        if (isOwned) { userData.customColor = item.className; saveToCloud(true); renderShopItems(); updateUI(); }
                        else { if (userData.score >= item.price) { userData.score -= item.price; userData.inventory.push(item.id); userData.customColor = item.className; updateUI(); saveToCloud(true); renderShopItems(); createParticles(window.innerWidth/2, window.innerHeight/2, 30); } else alert('Недостаточно кликов!'); }
                    };
                    shopList.appendChild(div);
                });
            }

            else if (currentShopCategory === 'title') {
                allTitles.forEach(item => {
                    const titleText = `${item.icon} ${item.name.toUpperCase()}`;
                    const isEquipped = userData.customTitle === titleText;

                    if (item.requiredLevel > 0) {
                        const isUnlocked = userData.level >= item.requiredLevel;
                        const div = document.createElement('div'); div.className = 'shop-item';
                        div.innerHTML = `<div style="display:flex; align-items:center;"><span class="preview" style="width:35px; height:35px; display:flex; align-items:center; justify-content:center;">${item.icon}</span><div style="margin-left: 10px;"><div style="font-weight:bold; color:#ffd700">${item.name}</div><div style="font-size:0.7rem; color:${isUnlocked ? '#0f0' : '#ff3366'};">${isUnlocked ? 'Доступно' : 'Достигните ' + item.requiredLevel + ' лвл'}</div></div></div><button class="buy-btn" ${isEquipped || !isUnlocked ? 'disabled' : ''}>${isEquipped ? 'Надето' : 'Надеть'}</button>`;
                        const btn = div.querySelector('button');
                        btn.onclick = () => { if (!isUnlocked) return; userData.customTitle = titleText; saveToCloud(true); renderShopItems(); updateUI(); };
                        shopList.appendChild(div);
                    } else {
                        const isOwned = userData.inventory.includes(item.id);
                        const div = document.createElement('div'); div.className = 'shop-item';
                        const titleClass = item.isDarkBlue ? 'dark-blue-title' : '';
                        div.innerHTML = `<div style="display:flex; align-items:center;"><span class="preview" style="width:35px; height:35px; display:flex; align-items:center; justify-content:center;">${item.icon}</span><div style="margin-left: 10px;"><div class="title-name ${titleClass}" style="font-weight:bold;">${item.name}</div><div style="font-size:0.7rem; color:#aaa;">${isOwned ? 'Куплено' : 'Цена: ' + item.price}</div></div></div><button class="buy-btn" ${isEquipped ? 'disabled' : ''}>${isEquipped ? 'Надето' : (isOwned ? 'Надеть' : 'Купить')}</button>`;
                        const btn = div.querySelector('button');
                        btn.onclick = () => {
                            if (isEquipped) return;
                            if (isOwned) { userData.customTitle = titleText; saveToCloud(true); renderShopItems(); updateUI(); }
                            else { if (userData.score >= item.price) { userData.score -= item.price; userData.inventory.push(item.id); userData.customTitle = titleText; updateUI(); saveToCloud(true); renderShopItems(); createParticles(window.innerWidth/2, window.innerHeight/2, 30); } else alert('Недостаточно кликов!'); }
                        };
                        shopList.appendChild(div);
                    }
                });
            }

            else if (currentShopCategory === 'pin') {
                allPins.forEach(item => {
                    const isOwned = userData.inventory.includes(item.id);
                    const isEquipped = userData.customPin === item.icon;
                    const div = document.createElement('div'); div.className = 'shop-item';
                    div.innerHTML = `<div style="display:flex; align-items:center;"><span class="preview" style="font-size:1.5rem; width:35px; height:35px; display:flex; align-items:center; justify-content:center;">${item.icon}</span><div style="margin-left: 10px;"><div style="font-weight:bold; color:#fff">${item.name}</div><div style="font-size:0.7rem; color:#aaa;">${isOwned ? 'Куплено' : 'Цена: ' + item.price}</div></div></div><button class="buy-btn" ${isEquipped ? 'disabled' : ''}>${isEquipped ? 'Надето' : (isOwned ? 'Надеть' : 'Купить')}</button>`;
                    const btn = div.querySelector('button');
                    btn.onclick = () => {
                        if (isEquipped) return;
                        if (isOwned) { userData.customPin = item.icon; saveToCloud(true); renderShopItems(); updateUI(); }
                        else { if (userData.score >= item.price) { userData.score -= item.price; userData.inventory.push(item.id); userData.customPin = item.icon; updateUI(); saveToCloud(true); renderShopItems(); createParticles(window.innerWidth/2, window.innerHeight/2, 30); } else alert('Недостаточно кликов!'); }
                    };
                    shopList.appendChild(div);
                });
            }

            else if (currentShopCategory === 'lootbox') {
                const div = document.createElement('div'); div.className = 'shop-item';
                div.innerHTML = `
                    <div style="display:flex; align-items:center;">
                        <span class="preview" style="font-size:2rem; width:35px; height:35px; display:flex; align-items:center; justify-content:center;">📦</span>
                        <div style="margin-left: 10px;">
                            <div style="font-weight:bold; color:#f0f">Случайный Бокс</div>
                            <div style="font-size:0.7rem; color:#aaa;">Цена: ${BOX_COST} кликов</div>
                            <div style="font-size:0.6rem; color:#888; margin-top:2px;">Шанс: Клики (50%), Иконки (25%), Рамки (3%), Пины (12%), Баннеры (10%)</div>
                        </div>
                    </div>
                    <button class="buy-btn" ${userData.score < BOX_COST ? 'disabled' : ''}>Открыть</button>
                `;
                const btn = div.querySelector('button');
                btn.onclick = openLootBox;
                shopList.appendChild(div);
            }
        }

        // --- Таблица лидеров ---
        async function loadLeaderboard() {
            leaderboardList.innerHTML = '<div style="text-align:center; color:#0ff;">Загрузка...</div>';
            try {
                const q = query(collection(db, "users"), orderBy("score", "desc"), limit(30));
                const querySnapshot = await getDocs(q, { source: 'server' });
                
                let players = [];
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    if (data.banned) return;
                    
                    let actualScore = (docSnap.id === currentUser.uid) ? userData.score : data.score;
                    players.push({ id: docSnap.id, data: data, score: actualScore });
                });

                players.sort((a, b) => b.score - a.score);

                leaderboardList.innerHTML = ''; 
                let rank = 1;
                
                players.forEach((player) => {
                    const data = player.data;
                    const isSelf = player.id === currentUser.uid;
                    const div = document.createElement('div'); 
                    div.className = `leader-item ${isSelf ? 'self' : ''}`;
                    
                    const colorClass = data.customColor || '';
                    const frameClass = data.customFrame || '';
                    const pinIcon = data.customPin || '';
                    
                    let avatarHtml = data.avatar || '👤';
                    if (frameClass) {
                        avatarHtml = `<span class="${frameClass}" style="display:inline-flex; justify-content:center; align-items:center; width:24px; height:24px; font-size:0.8rem;">${avatarHtml}</span>`;
                    }
                    
                    div.innerHTML = `<span>${rank}. ${avatarHtml} <span class="${colorClass}">${data.nickname || 'Игрок'}</span> ${pinIcon ? `<span>${pinIcon}</span>` : ''} <span style="font-size:0.65rem; color:#ffd700;">${getDisplayTitle(data.level, data.customTitle)}</span></span><span style="font-weight:bold; color:#0ff;">${Math.floor(player.score)}</span>`;
                    
                    div.onclick = () => showProfile(data, player.id);
                    
                    if (isAdmin && !isSelf) {
                        const banBtn = document.createElement('button'); 
                        banBtn.textContent = 'Бан';
                        banBtn.style.cssText = "margin-left: 10px; padding: 4px 8px; font-size: 0.7rem; background: transparent; color: #f00; border: 1px solid #f00; border-radius: 5px; cursor: pointer;";
                        banBtn.onclick = async (e) => {
                            e.stopPropagation(); 
                            if (banBtn.disabled) return; 
                            banBtn.disabled = true; 
                            banBtn.textContent = '...';
                            try { await updateDoc(doc(db, "users", player.id), { banned: true }); div.style.display = 'none'; }
                            catch (err) { alert('Ошибка при бане!'); banBtn.textContent = 'Бан'; banBtn.disabled = false; }
                        };
                        div.appendChild(banBtn);
                    }
                    leaderboardList.appendChild(div); 
                    rank++;
                });
                
                if (rank === 1) leaderboardList.innerHTML = '<div style="text-align:center;">Пока нет игроков</div>';
            } catch (e) { 
                console.error(e);
                leaderboardList.innerHTML = '<div style="text-align:center; color:red;">Ошибка загрузки</div>'; 
            }
        }

        document.getElementById('leaderboardBtn').addEventListener('click', () => {
            showScreen(leaderboardScreen);
            loadLeaderboard();
        });
        document.getElementById('refreshLeaderboardBtn').addEventListener('click', loadLeaderboard);
        document.getElementById('closeLeaderboardBtn').addEventListener('click', () => showScreen(gameScreen));

        // --- Профиль игрока ---
        function showProfile(data, uid) {
            viewingProfileUid = uid;
            
            const profileBox = document.getElementById('profileBox');
            profileBox.className = 'profile-box'; 
            
            const frameBadge = document.getElementById('profileFrameBadge');
            frameBadge.style.display = 'none';

            if (data.customFrame) {
                profileBox.classList.add(data.customFrame);
                const frameItem = allFrames.find(f => f.className === data.customFrame);
                if (frameItem) {
                    frameBadge.textContent = frameItem.icon;
                    frameBadge.style.display = 'flex';
                }
            }

            document.getElementById('profileBanner').style.background = data.banner || 'linear-gradient(90deg, #111, #333)';
            const bannerItem = shopItems.find(i => i.style === data.banner);
            if (bannerItem && bannerItem.isAnimated) {
                document.getElementById('profileBanner').classList.add('animated-banner');
            } else {
                document.getElementById('profileBanner').classList.remove('animated-banner');
            }

            document.getElementById('profileAvatar').textContent = data.avatar || '👤';
            
            const nameEl = document.getElementById('profileName');
            nameEl.textContent = data.nickname || 'Игрок';
            nameEl.className = 'profile-name ' + (data.customColor || '');
            
            const pinEl = document.getElementById('profilePin');
            pinEl.textContent = data.customPin || '';

            const rankEl = document.getElementById('profileRank');
            rankEl.textContent = getDisplayTitle(data.level, data.customTitle);
            const isDarkBlue = allTitles.some(t => t.isDarkBlue && `${t.icon} ${t.name.toUpperCase()}` === data.customTitle);
            rankEl.className = 'profile-rank ' + (isDarkBlue ? 'dark-blue-title' : '');

            document.getElementById('profileScore').textContent = Math.floor(data.score);
            document.getElementById('profileLevel').textContent = data.level;
            
            const addBtn = document.getElementById('addFriendBtn');
            const chatBtn = document.getElementById('chatWithFriendBtn');

            if (uid !== currentUser.uid) {
                if (userData.friends && userData.friends.includes(uid)) {
                    addBtn.style.display = 'none';
                    chatBtn.style.display = 'block'; 
                } else {
                    addBtn.style.display = 'block';
                    addBtn.textContent = 'Добавить в друзья'; 
                    addBtn.disabled = false;
                    chatBtn.style.display = 'none';
                }
            } else {
                addBtn.style.display = 'none';
                chatBtn.style.display = 'none';
            }
            showScreen(profileScreen);
        }

        document.getElementById('myProfileBtn').addEventListener('click', () => showProfile(userData, currentUser.uid));
        document.getElementById('closeProfileBtn').addEventListener('click', () => { if (leaderboardScreen.classList.contains('active') === false) showScreen(gameScreen); else showScreen(leaderboardScreen); });

        // --- Частицы ---
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        const colors = ['#00ffff', '#ff00ff', '#aa88ff', '#00ffcc', '#ffaa00'];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();
        function createParticles(x, y, count, big = false) {
            for (let i = 0; i < (big ? count * 2 : count); i++) {
                particles.push({ x: x + (Math.random() - 0.5) * 100, y: y + (Math.random() - 0.5) * 100, vx: (Math.random() - 0.5) * 10, vy: (Math.random() - 0.5) * 10, life: 1, color: colors[Math.floor(Math.random() * colors.length)], size: Math.random() * 4 + 2 });
            }
        }
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.globalCompositeOperation = 'lighter';
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i]; p.x += p.vx; p.y += p.vy; p.life -= 0.02;
                if (p.life <= 0) { particles.splice(i, 1); continue; }
                ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
            }
            ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
            requestAnimationFrame(animate);
        }
        animate();
    </script>
