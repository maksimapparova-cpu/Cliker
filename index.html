<!DOCTYPE html>

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: #0a0a1a; min-height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; color: white; }
        #particleCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        .screen { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; max-width: 360px; padding: 16px; z-index: 20; gap: 14px; }
        .screen.active { display: flex; }
        
        /* Авторизация */
        .auth-box { display: flex; flex-direction: column; gap: 12px; width: 100%; background: rgba(10, 5, 25, 0.8); padding: 24px; border-radius: 20px; border: 1px solid #0ff; box-shadow: 0 0 20px rgba(0, 255, 255, 0.3); }
        .auth-box h2 { text-align: center; margin-bottom: 10px; text-shadow: 0 0 10px #0ff; }
        .auth-box input { padding: 12px; border-radius: 10px; background: rgba(0,0,0,0.5); border: 1px solid #f0f; color: white; outline: none; font-size: 1rem; }
        .auth-box input:focus { border-color: #0ff; box-shadow: 0 0 10px #0ff; }
        .auth-btn { padding: 12px; border-radius: 10px; background: linear-gradient(135deg, #0ff, #00aaff); border: none; font-weight: bold; font-size: 1rem; cursor: pointer; text-transform: uppercase; color: #000; }
        .auth-switch { text-align: center; font-size: 0.8rem; margin-top: 10px; color: #aaa; cursor: pointer; }
        .auth-switch span { color: #f0f; text-decoration: underline; }

        /* Меню и игра */
        .menu { display: flex; gap: 5px; padding: 8px 10px; background: rgba(10, 5, 25, 0.7); border: 1px solid rgba(0, 255, 255, 0.3); border-radius: 40px; flex-wrap: wrap; justify-content: center; width: 100%; }
        .menu-btn { background: transparent; border: none; color: #a0f0ff; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; padding: 5px 6px; cursor: pointer; text-shadow: 0 0 6px cyan; }
        .score-panel { font-size: 2.4rem; font-weight: 800; text-shadow: 0 0 8px #0ff, 0 0 18px #0ff; background: rgba(0, 20, 30, 0.5); padding: 0 22px; border-radius: 50px; border: 1px solid rgba(0, 255, 255, 0.5); }
        .clicker-btn { width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #00ffff, #0066cc, #220044); border: 3px solid #0ff; box-shadow: 0 0 22px #0ff, 0 0 50px #00aaff; cursor: pointer; font-size: 1.3rem; font-weight: 900; color: white; display: flex; justify-content: center; align-items: center; outline: none; transition: 0.1s; }
        .clicker-btn:active { transform: scale(0.92); }
        
        /* Улучшения */
        .upgrade-panel { padding: 10px 16px; background: rgba(10, 5, 25, 0.8); border: 1px solid rgba(255, 0, 255, 0.35); border-radius: 18px; display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
        .upgrade-btn { width: 100%; padding: 10px; font-size: 0.8rem; font-weight: 700; color: #fff; background: linear-gradient(135deg, #2a0a3a, #0a1a3a); border: 2px solid #f0f; border-radius: 40px; cursor: pointer; }
        .upgrade-btn:disabled { opacity: 0.5; cursor: not-allowed; border-color: #555; }
        .progress-bar-wrap { width: 100%; height: 6px; background: rgba(0, 0, 0, 0.6); border-radius: 10px; overflow: hidden; border: 1px solid rgba(0, 255, 255, 0.25); }
        .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #0ff, #f0f, #0ff); transition: width 0.3s; }
        .level-badge { font-size: 0.7rem; color: #f0f; text-transform: uppercase; }
        .rank-badge { font-size: 0.75rem; color: #ffd700; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; text-shadow: 0 0 8px rgba(255, 215, 0, 0.6); }
        
        /* Пассивный доход */
        .passive-panel { padding: 10px 16px; background: rgba(10, 5, 25, 0.8); border: 1px solid rgba(0, 255, 255, 0.35); border-radius: 18px; display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
        .passive-btn { width: 100%; padding: 10px; font-size: 0.8rem; font-weight: 700; color: #fff; background: linear-gradient(135deg, #0a2a3a, #0a3a2a); border: 2px solid #0ff; border-radius: 40px; cursor: pointer; }
        .passive-btn:disabled { opacity: 0.5; cursor: not-allowed; border-color: #555; }

        .shop-category { font-size: 0.8rem; color: #ffd700; text-transform: uppercase; margin: 10px 0 5px 0; font-weight: bold; text-align: left; width: 100%; }
        
        .shop-item, .friend-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); font-size: 0.9rem; }

        .action-btn.danger { background: #ff3366; color: white; }
        
        .leader-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 0.9rem; cursor: pointer; transition: 0.2s; border-radius: 8px; }
        .leader-item:hover { background: rgba(255,255,255,0.1); }
        .leader-item.self { background: rgba(0, 255, 255, 0.1); color: #0ff; }
        
        .close-btn { margin-top: 15px; padding: 10px; width: 100%; background: transparent; border: 1px solid #0ff; color: #0ff; border-radius: 20px; cursor: pointer; text-transform: uppercase; }

        /* Поддержка */
        .support-box textarea { width: 100%; padding: 10px; border-radius: 10px; background: rgba(0,0,0,0.5); border: 1px solid #f0f; color: white; outline: none; resize: none; height: 80px; font-size: 0.9rem; }
        .support-box .ticket-item { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 8px; font-size: 0.8rem; }
        .support-box .ticket-reply { background: rgba(0,255,255,0.1); padding: 8px; border-radius: 8px; margin-top: 5px; border-left: 2px solid #0ff; }

        /* Профиль игрока */
        .profile-box { width: 100%; background: rgba(10, 5, 25, 0.9); padding: 20px; border-radius: 20px; border: 2px solid #0ff; display: flex; flex-direction: column; align-items: center; gap: 10px; position: relative; overflow: hidden; }

        .profile-avatar { font-size: 4rem; z-index: 1; margin-top: 30px; text-shadow: 0 0 10px #0ff; }
        .profile-name { font-size: 1.5rem; font-weight: bold; z-index: 1; text-shadow: 0 0 10px #fff; margin-top: 5px; }
        .profile-rank { font-size: 0.9rem; color: #ffd700; z-index: 1; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 10px; }

        /* Переливающиеся цвета */

            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: rainbow-anim 3s linear infinite;
        }
        .neon-blue-text {
            color: #0ff;
            text-shadow: 0 0 5px #0ff, 0 0 15px #0ff, 0 0 25px #0ff;

        authActionBtn.addEventListener('click', async () => {
            const nick = nicknameInput.value.trim();
            const pass = passwordInput.value;
            if (nick.length < 3) return authError.textContent = 'Ник должен быть от 3 символов';
            if (pass.length < 6) return authError.textContent = 'Пароль должен быть от 6 символов';
            
            // Генерируем случайный email, чтобы можно было менять ник
            const randomId = Math.random().toString(36).substring(2, 10);
            const fakeEmail = isLoginMode 
                ? `${nick.toLowerCase().replace(/[^a-z0-9]/g, '')}@neonclicker.com` 
                : `user_${randomId}@neonclicker.com`;

            authActionBtn.disabled = true;
            authError.textContent = '';
            try {
                if (isLoginMode) {
                    await signInWithEmailAndPassword(auth, fakeEmail, pass);
                } else {
                    const userCredential = await createUserWithEmailAndPassword(auth, fakeEmail, pass);
                    await setDoc(doc(db, "users", userCredential.user.uid), {
                        nickname: nick, score: 0, clicksPerClick: 1, level: 1, upgradeCost: 4, banned: false,

                        passiveMultiplier: 1,
                        passiveUpgradeCost: 10,
                        lastLogoutTime: Date.now()
                    });

                if (error.code === 'auth/email-already-in-use') authError.textContent = 'Этот ник уже занят';
                else if (error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') authError.textContent = 'Неверный ник или пароль';

                    startPassiveIncome();

        function calculateOfflineIncome() {
            const now = Date.now();
            const offlineTimeMs = now - userData.lastLogoutTime;
            const OFFLINE_LIMIT_MS = 24 * 60 * 60 * 1000;
            const timeToCount = Math.min(offlineTimeMs, OFFLINE_LIMIT_MS);

            if (timeToCount > 10000) {
                const incomePer2Sec = userData.level * userData.passiveMultiplier;
                const periods = Math.floor(timeToCount / 2000);
                const offlineIncome = periods * incomePer2Sec;

                if (offlineIncome > 0) {
                    userData.score += offlineIncome;
                    setTimeout(() => {
                        alert(`С возвращением! Пока вас не было, вы заработали: ${offlineIncome} кликов.`);
                    }, 500);
                }
            }
            userData.lastLogoutTime = now;
        }

        function showScreen(screen) {
            screens.forEach(s => s.classList.remove('active'));
            screen.classList.add('active');
        }

        function updateUI() {
            scoreDisplay.textContent = Math.floor(userData.score);
            levelBadge.textContent = `УРОВЕНЬ ${userData.level} · +${userData.clicksPerClick}`;
            clickValueLabel.textContent = `+${userData.clicksPerClick} за клик`;
            rankBadge.textContent = getDisplayTitle(userData.level, userData.customTitle);
            nextUpgradeCostEl.textContent = userData.upgradeCost;
            
            const canUpgrade = userData.score >= userData.upgradeCost;
            upgradeBtn.disabled = !canUpgrade;
            upgradeBtn.textContent = canUpgrade ? `Улучшить (${userData.upgradeCost})` : `Нужно ${userData.upgradeCost}`;
            
            progressBar.style.width = (Math.min(userData.score, userData.upgradeCost) / userData.upgradeCost * 100) + '%';

            const passiveIncome = userData.level * userData.passiveMultiplier;
            passiveIncomeDisplay.textContent = `+${passiveIncome} / 2 сек`;

            const canUpgradePassive = userData.score >= userData.passiveUpgradeCost;
            upgradePassiveBtn.disabled = !canUpgradePassive;
            upgradePassiveBtn.textContent = canUpgradePassive ? `Улучшить пассив (${userData.passiveUpgradeCost})` : `Нужно ${userData.passiveUpgradeCost}`;
        }

        let saveTimeout;
        function saveToCloud(immediate = false, isLogout = false) {
            if (!currentUser || userData.banned) return;
            const performSave = async () => {
                try {
                    const dataToSave = {
                        score: Math.floor(userData.score), clicksPerClick: userData.clicksPerClick, 
                        level: userData.level, upgradeCost: userData.upgradeCost,
                        avatar: userData.avatar, banner: userData.banner, 
                        customTitle: userData.customTitle, customColor: userData.customColor,
                        inventory: userData.inventory,
                        passiveMultiplier: userData.passiveMultiplier,
                        passiveUpgradeCost: userData.passiveUpgradeCost
                    };
                    if (isLogout) dataToSave.lastLogoutTime = Date.now();
                    await updateDoc(doc(db, "users", currentUser.uid), dataToSave);
                } catch (e) { console.error("Ошибка сохранения:", e); }
            };
            clearTimeout(saveTimeout);
            if (immediate) performSave(); else saveTimeout = setTimeout(performSave, 2000);
        }

        // --- Пассивный доход ---
        function startPassiveIncome() {
            if (passiveInterval) clearInterval(passiveInterval);
            passiveInterval = setInterval(() => {
                if (!currentUser || userData.banned) return;
                const income = userData.level * userData.passiveMultiplier;
                if (income > 0) {
                    userData.score += income;
                    updateUI();
                    saveToCloud();
                    createParticles(window.innerWidth / 2, window.innerHeight / 2, 5);
                }
            }, 2000); // 2 секунды
        }

        upgradePassiveBtn.addEventListener('click', () => {
            if (!currentUser || userData.banned || userData.score < userData.passiveUpgradeCost) return;
            userData.score -= userData.passiveUpgradeCost;
            userData.passiveMultiplier += 1;
            userData.passiveUpgradeCost *= 2;
            updateUI(); saveToCloud(true);
            createParticles(window.innerWidth / 2, window.innerHeight / 2, 40, true);
        });

            if (!currentUser || userData.banned) return;

            createParticles(window.innerWidth / 2, window.innerHeight / 2, 15);

        async function loadFriends() {
            myFriendsList.innerHTML = 'Загрузка...';
            friendRequestsList.innerHTML = 'Загрузка...';
            
            myFriendsList.innerHTML = '';
            if (userData.friends && userData.friends.length > 0) {
                for (const uid of userData.friends) {
                    const fDoc = await getDoc(doc(db, "users", uid));
                    if (fDoc.exists()) {
                        const fData = fDoc.data();
                        const div = document.createElement('div');
                        div.className = 'friend-item';
                        // Показываем цвет друга
                        const colorClass = fData.customColor || '';
                        div.innerHTML = `<span>${fData.avatar || '👤'} <span class="${colorClass}">${fData.nickname}</span></span>`;
                        
                        const btn = document.createElement('button');
                        btn.className = 'action-btn danger';
                        btn.textContent = 'Удалить';
                        btn.onclick = async () => {
                            await updateDoc(doc(db, "users", currentUser.uid), { friends: arrayRemove(uid) });
                            await updateDoc(doc(db, "users", uid), { friends: arrayRemove(currentUser.uid) });
                            userData.friends = userData.friends.filter(id => id !== uid);
                            loadFriends();
                        };
                        div.appendChild(btn);
                        myFriendsList.appendChild(div);
                    }
                }
            } else {
                myFriendsList.innerHTML = '<div style="color:#aaa; font-size:0.8rem;">У вас пока нет друзей</div>';
            }

            friendRequestsList.innerHTML = '';
            const q = query(collection(db, "friendRequests"), where("to", "==", currentUser.uid));
            const reqSnap = await getDocs(q);
            if (reqSnap.empty) {
                friendRequestsList.innerHTML = '<div style="color:#aaa; font-size:0.8rem;">Нет новых запросов</div>';
            } else {
                for (const reqDoc of reqSnap.docs) {
                    const reqData = reqDoc.data();
                    const senderDoc = await getDoc(doc(db, "users", reqData.from));
                    if (senderDoc.exists()) {
                        const senderData = senderDoc.data();
                        const div = document.createElement('div');
                        div.className = 'friend-item';
                        const colorClass = senderData.customColor || '';
                        div.innerHTML = `<span>${senderData.avatar} <span class="${colorClass}">${senderData.nickname}</span></span>`;
                        
                        const btnContainer = document.createElement('div');
                        
                        const accBtn = document.createElement('button');
                        accBtn.className = 'action-btn';
                        accBtn.textContent = 'Принять';
                        accBtn.style.marginRight = '5px';
                        accBtn.onclick = async () => {
                            await updateDoc(doc(db, "users", currentUser.uid), { friends: arrayUnion(reqData.from) });
                            await updateDoc(doc(db, "users", reqData.from), { friends: arrayUnion(currentUser.uid) });
                            await deleteDoc(doc(db, "friendRequests", reqDoc.id));
                            userData.friends.push(reqData.from);
                            loadFriends();
                        };
                        
                        const rejBtn = document.createElement('button');
                        rejBtn.className = 'action-btn danger';
                        rejBtn.textContent = 'Отклонить';
                        rejBtn.onclick = async () => {
                            await deleteDoc(doc(db, "friendRequests", reqDoc.id));
                            loadFriends();

                        btnContainer.appendChild(accBtn);
                        btnContainer.appendChild(rejBtn);
                        div.appendChild(btnContainer);

            searchResult.innerHTML = 'Поиск...';
            
            const q = query(collection(db, "users"), where("nickname", "==", searchNick));
            const snap = await getDocs(q);
            
            if (snap.empty) {
                searchResult.innerHTML = '<div style="color:#ff3366; font-size:0.8rem;">Игрок не найден</div>';
                return;
            }
            
            const foundDoc = snap.docs[0];
            const foundData = foundDoc.data();
            const foundUid = foundDoc.id;
            
            if (foundUid === currentUser.uid) {
                searchResult.innerHTML = '<div style="color:#ff3366; font-size:0.8rem;">Это вы!</div>';
                return;
            }
            if (userData.friends && userData.friends.includes(foundUid)) {

        async function loadTickets() {
            ticketsList.innerHTML = 'Загрузка...';
            const q = query(collection(db, "tickets"), where("uid", "==", currentUser.uid));
            const snap = await getDocs(q);
            ticketsList.innerHTML = '';
            if (snap.empty) {
                ticketsList.innerHTML = '<div style="color:#aaa; font-size:0.8rem; text-align:center; margin-bottom:10px;">У вас нет активных запросов</div>';
                return;
            }
            const sortedDocs = snap.docs.sort((a, b) => b.data().timestamp - a.data().timestamp);
            sortedDocs.forEach(docSnap => {
                const data = docSnap.data();
                const date = new Date(data.timestamp).toLocaleString();
                let html = `<div class="ticket-item">
                    <div style="font-size:0.7rem; color:#aaa; margin-bottom:5px;">${date} · Статус: ${data.status === 'closed' ? '✅ Закрыт' : '⏳ В ожидании'}</div>
                    <div>${data.message}</div>`;
                if (data.reply) html += `<div class="ticket-reply"><b>Ответ поддержки:</b><br>${data.reply}</div>`;
                html += `</div>`;
                ticketsList.innerHTML += html;
            });
        }

            btn.disabled = true; btn.textContent = 'Отправка...';

                await addDoc(collection(db, "tickets"), { uid: currentUser.uid, nickname: userData.nickname, message: msg, status: 'open', reply: '', timestamp: Date.now() });

        function renderShop() {
            shopList.innerHTML = '';

            // 1. АВАТАРКИ
            const catAvatars = document.createElement('div'); catAvatars.className = 'shop-category'; catAvatars.textContent = 'Аватарки'; shopList.appendChild(catAvatars);
            shopItems.filter(i => i.type === 'avatar').forEach(item => {

                const div = document.createElement('div'); div.className = 'shop-item';
                div.innerHTML = `
                    <div style="display:flex; align-items:center;">
                        <span class="preview" style="width:35px; height:35px; display:flex; align-items:center; justify-content:center;">${item.icon}</span>
                        <div style="margin-left: 10px;">
                            <div style="font-weight:bold; color:#fff">${item.name}</div>
                            <div style="font-size:0.7rem; color:#aaa;">${isOwned ? 'Куплено' : 'Цена: ' + item.price}</div>
                        </div>
                    </div>
                    <button class="buy-btn" ${isEquipped ? 'disabled' : ''}>${isEquipped ? 'Надето' : (isOwned ? 'Надеть' : 'Купить')}</button>
                `;
                const btn = div.querySelector('button');
                btn.onclick = () => {
                    if (isEquipped) return;
                    if (isOwned) { userData.avatar = item.icon; saveToCloud(true); renderShop(); updateUI(); }
                    else {
                        if (userData.score >= item.price) {
                            userData.score -= item.price; userData.inventory.push(item.id); userData.avatar = item.icon;
                            updateUI(); saveToCloud(true); renderShop(); createParticles(window.innerWidth/2, window.innerHeight/2, 30);
                        } else alert('Недостаточно кликов!');
                    }
                };
                shopList.appendChild(div);
            });

            // 2. БАННЕРЫ
            const catBanners = document.createElement('div'); catBanners.className = 'shop-category'; catBanners.textContent = 'Баннеры'; shopList.appendChild(catBanners);
            shopItems.filter(i => i.type === 'banner').forEach(item => {
                const isOwned = userData.inventory.includes(item.id);
                const isEquipped = userData.banner === item.style;
                const div = document.createElement('div'); div.className = 'shop-item';
                div.innerHTML = `
                    <div style="display:flex; align-items:center;">
                        <span class="preview" style="background:${item.style}; border-radius:5px; width:35px; height:35px; display:flex; align-items:center; justify-content:center;">${item.icon}</span>
                        <div style="margin-left: 10px;">
                            <div style="font-weight:bold; color:#0ff">${item.name}</div>
                            <div style="font-size:0.7rem; color:#aaa;">${isOwned ? 'Куплено' : 'Цена: ' + item.price}</div>
                        </div>
                    </div>
                    <button class="buy-btn" ${isEquipped ? 'disabled' : ''}>${isEquipped ? 'Надето' : (isOwned ? 'Надеть' : 'Купить')}</button>
                `;
                const btn = div.querySelector('button');
                btn.onclick = () => {
                    if (isEquipped) return;
                    if (isOwned) { userData.banner = item.style; saveToCloud(true); renderShop(); updateUI(); }
                    else {
                        if (userData.score >= item.price) {
                            userData.score -= item.price; userData.inventory.push(item.id); userData.banner = item.style;
                            updateUI(); saveToCloud(true); renderShop(); createParticles(window.innerWidth/2, window.innerHeight/2, 30);
                        } else alert('Недостаточно кликов!');
                    }
                };
                shopList.appendChild(div);
            });

            // 3. ЦВЕТА
            const catColors = document.createElement('div'); catColors.className = 'shop-category'; catColors.textContent = 'Цвета для ника'; shopList.appendChild(catColors);
            allColors.forEach(item => {
                const isOwned = userData.inventory.includes(item.id);
                const isEquipped = userData.customColor === item.className;
                const div = document.createElement('div'); div.className = 'shop-item';
                div.innerHTML = `
                    <div style="display:flex; align-items:center;">
                        <span class="preview ${item.className}" style="font-weight:bold; font-size:1.2rem; width:35px; height:35px; display:flex; align-items:center; justify-content:center;">Aa</span>
                        <div style="margin-left: 10px;">
                            <div style="font-weight:bold; color:#fff">${item.name}</div>
                            <div style="font-size:0.7rem; color:#aaa;">${isOwned ? 'Куплено' : 'Цена: ' + item.price}</div>
                        </div>
                    </div>
                    <button class="buy-btn" ${isEquipped ? 'disabled' : ''}>${isEquipped ? 'Надето' : (isOwned ? 'Надеть' : 'Купить')}</button>
                `;
                const btn = div.querySelector('button');
                btn.onclick = () => {
                    if (isEquipped) return;
                    if (isOwned) { userData.customColor = item.className; saveToCloud(true); renderShop(); updateUI(); }
                    else {
                        if (userData.score >= item.price) {
                            userData.score -= item.price; userData.inventory.push(item.id); userData.customColor = item.className;
                            updateUI(); saveToCloud(true); renderShop(); createParticles(window.innerWidth/2, window.innerHeight/2, 30);
                        } else alert('Недостаточно кликов!');
                    }
                };
                shopList.appendChild(div);
            });

            // 4. ТИТУЛЫ
            const catTitles = document.createElement('div'); catTitles.className = 'shop-category'; catTitles.textContent = 'Титулы'; shopList.appendChild(catTitles);
            allTitles.forEach(item => {
                const titleText = `${item.icon} ${item.name.toUpperCase()}`;
                const isEquipped = userData.customTitle === titleText;

                if (item.requiredLevel > 0) {
                    const isUnlocked = userData.level >= item.requiredLevel;
                    const div = document.createElement('div'); div.className = 'shop-item';
                    div.innerHTML = `
                        <div style="display:flex; align-items:center;">
                            <span class="preview" style="width:35px; height:35px; display:flex; align-items:center; justify-content:center;">${item.icon}</span>
                            <div style="margin-left: 10px;">
                                <div style="font-weight:bold; color:#ffd700">${item.name}</div>
                                <div style="font-size:0.7rem; color:${isUnlocked ? '#0f0' : '#ff3366'};">${isUnlocked ? 'Доступно' : 'Достигните ' + item.requiredLevel + ' лвл'}</div>
                            </div>
                        </div>
                        <button class="buy-btn" ${isEquipped || !isUnlocked ? 'disabled' : ''}>${isEquipped ? 'Надето' : 'Надеть'}</button>
                    `;
                    const btn = div.querySelector('button');
                    btn.onclick = () => {
                        if (!isUnlocked) return;
                        userData.customTitle = titleText; saveToCloud(true); renderShop(); updateUI();
                    };
                    shopList.appendChild(div);
                } else {
                    const isOwned = userData.inventory.includes(item.id);
                    const div = document.createElement('div'); div.className = 'shop-item';
                    div.innerHTML = `
                        <div style="display:flex; align-items:center;">
                            <span class="preview" style="width:35px; height:35px; display:flex; align-items:center; justify-content:center;">${item.icon}</span>
                            <div style="margin-left: 10px;">
                                <div style="font-weight:bold; color:#0ff">${item.name}</div>
                                <div style="font-size:0.7rem; color:#aaa;">${isOwned ? 'Куплено' : 'Цена: ' + item.price}</div>
                            </div>
                        </div>
                        <button class="buy-btn" ${isEquipped ? 'disabled' : ''}>${isEquipped ? 'Надето' : (isOwned ? 'Надеть' : 'Купить')}</button>
                    `;
                    const btn = div.querySelector('button');
                    btn.onclick = () => {
                        if (isEquipped) return;
                        if (isOwned) { userData.customTitle = titleText; saveToCloud(true); renderShop(); updateUI(); }
                        else {
                            if (userData.score >= item.price) {
                                userData.score -= item.price; userData.inventory.push(item.id); userData.customTitle = titleText;
                                updateUI(); saveToCloud(true); renderShop(); createParticles(window.innerWidth/2, window.innerHeight/2, 30);
                            } else alert('Недостаточно кликов!');
                        }
                    };
                    shopList.appendChild(div);
                }
            });
        }

        // --- Таблица лидеров ---
        document.getElementById('leaderboardBtn').addEventListener('click', async () => {
            showScreen(leaderboardScreen);
            leaderboardList.innerHTML = '<div style="text-align:center; color:#0ff;">Загрузка...</div>';
            try {
                const q = query(collection(db, "users"), orderBy("score", "desc"), limit(30));
                const querySnapshot = await getDocs(q);
                leaderboardList.innerHTML = '';
                let rank = 1;
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    if (data.banned) return;
                    const isSelf = docSnap.id === currentUser.uid;
                    const div = document.createElement('div');
                    div.className = `leader-item ${isSelf ? 'self' : ''}`;
                    
                    const colorClass = data.customColor || '';
                    div.innerHTML = `<span>${rank}. ${data.avatar || '👤'} <span class="${colorClass}">${data.nickname || 'Игрок'}</span> <span style="font-size:0.65rem; color:#ffd700;">${getDisplayTitle(data.level, data.customTitle)}</span></span>
                    <span style="font-weight:bold; color:#0ff;">${Math.floor(data.score)}</span>`;
                    
                    div.onclick = () => showProfile(data, docSnap.id);
                    if (isAdmin && !isSelf) {
                        const banBtn = document.createElement('button');
                        banBtn.textContent = 'Бан';
                        banBtn.style.cssText = "margin-left: 10px; padding: 4px 8px; font-size: 0.7rem; background: transparent; color: #f00; border: 1px solid #f00; border-radius: 5px; cursor: pointer;";
                        banBtn.onclick = async (e) => {
                            e.stopPropagation();
                            if (banBtn.disabled) return;
                            banBtn.disabled = true; banBtn.textContent = '...';
                            try { await updateDoc(doc(db, "users", docSnap.id), { banned: true }); div.style.display = 'none'; }
                            catch (err) { alert('Ошибка при бане!'); banBtn.textContent = 'Бан'; banBtn.disabled = false; }
                        };
                        div.appendChild(banBtn);
                    }
                    leaderboardList.appendChild(div);
                    rank++;
                });
                if (rank === 1) leaderboardList.innerHTML = '<div style="text-align:center;">Пока нет игроков</div>';
            } catch (e) { leaderboardList.innerHTML = '<div style="text-align:center; color:red;">Ошибка загрузки</div>'; }
        });
        document.getElementById('closeLeaderboardBtn').addEventListener('click', () => showScreen(gameScreen));

        // --- Профиль игрока ---
        function showProfile(data, uid) {
            viewingProfileUid = uid;
            document.getElementById('profileBanner').style.background = data.banner || 'linear-gradient(90deg, #111, #333)';
            document.getElementById('profileAvatar').textContent = data.avatar || '👤';
            
            // Применяем цвет к нику в профиле
            const nameEl = document.getElementById('profileName');
            nameEl.textContent = data.nickname || 'Игрок';
            nameEl.className = 'profile-name ' + (data.customColor || '');

            document.getElementById('profileRank').textContent = getDisplayTitle(data.level, data.customTitle);
            document.getElementById('profileScore').textContent = Math.floor(data.score);
            document.getElementById('profileLevel').textContent = data.level;
            
            const changeNickBtn = document.getElementById('changeNickBtn');
            const addBtn = document.getElementById('addFriendBtn');

            if (uid === currentUser.uid) {
                changeNickBtn.style.display = 'block';
                addBtn.style.display = 'none';
            } else {
                changeNickBtn.style.display = 'none';
                addBtn.style.display = 'block';
                if (userData.friends && userData.friends.includes(uid)) {
                    addBtn.textContent = 'Уже в друзьях';
                    addBtn.disabled = true;
                } else {
                    addBtn.textContent = 'Добавить в друзья';
                    addBtn.disabled = false;
                }
            }
            showScreen(profileScreen);
        }

        // Смена ника
        document.getElementById('changeNickBtn').addEventListener('click', async () => {
            const newNick = prompt('Введите новый никнейм (от 3 до 15 символов):', userData.nickname);
            if (!newNick) return;
            const trimmed = newNick.trim();
            if (trimmed.length < 3 || trimmed.length > 15) return alert('Ник должен быть от 3 до 15 символов!');

            try {
                await updateDoc(doc(db, "users", currentUser.uid), { nickname: trimmed });
                userData.nickname = trimmed;
                alert('Ник успешно изменен!');
                showProfile(userData, currentUser.uid);
            } catch(e) {
                alert('Ошибка при смене ника. Возможно, Firestore запрещает менять поле nickname.');
            }
        });

        document.getElementById('myProfileBtn').addEventListener('click', () => showProfile(userData, currentUser.uid));
        document.getElementById('closeProfileBtn').addEventListener('click', () => {
            if (leaderboardScreen.classList.contains('active') === false) showScreen(gameScreen);
            else showScreen(leaderboardScreen);
        });

        // --- Частицы ---
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        const colors = ['#00ffff', '#ff00ff', '#aa88ff', '#00ffcc', '#ffaa00'];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();
        
        function createParticles(x, y, count, big = false) {
            for (let i = 0; i < (big ? count * 2 : count); i++) {
                particles.push({ x: x + (Math.random() - 0.5) * 100, y: y + (Math.random() - 0.5) * 100, vx: (Math.random() - 0.5) * 10, vy: (Math.random() - 0.5) * 10, life: 1, color: colors[Math.floor(Math.random() * colors.length)], size: Math.random() * 4 + 2 });
            }
        }
        
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.globalCompositeOperation = 'lighter';
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy; p.life -= 0.02;
                if (p.life <= 0) { particles.splice(i, 1); continue; }
                ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
            }
            ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
