<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>НЕОН КЛИКЕР · с сохранением</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            font-family: 'Segoe UI', 'Arial', sans-serif;
        }

        body {
            background: #0a0a1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .game-container {
            position: relative;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            padding: 16px;
            width: 100%;
            max-width: 360px;
        }

        .menu {
            display: flex;
            gap: 10px;
            padding: 8px 20px;
            background: rgba(10, 5, 25, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 40px;
            box-shadow: 0 0 18px rgba(0, 255, 255, 0.25), inset 0 0 10px rgba(255, 0, 255, 0.15);
        }

        .menu-btn {
            background: transparent;
            border: none;
            color: #a0f0ff;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 5px 10px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-shadow: 0 0 6px cyan, 0 0 12px blue;
        }

        .menu-btn:hover {
            color: #fff;
            text-shadow: 0 0 12px cyan, 0 0 22px magenta, 0 0 32px blue;
            background: rgba(0, 255, 255, 0.1);
        }

        .menu-btn:active {
            transform: scale(0.95);
        }

        .score-panel {
            font-size: 2.4rem;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 0 8px #0ff, 0 0 18px #0ff, 0 0 32px #f0f, 0 0 50px #f0f;
            letter-spacing: 2px;
            background: rgba(0, 20, 30, 0.5);
            padding: 0 22px;
            border-radius: 50px;
            border: 1px solid rgba(0, 255, 255, 0.5);
            backdrop-filter: blur(4px);
            transition: transform 0.08s ease;
            line-height: 1.2;
        }

        .clicker-btn {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #00ffff, #0066cc, #220044);
            border: 3px solid #0ff;
            box-shadow: 0 0 22px #0ff, 0 0 50px #00aaff, 0 0 80px #ff00ff, inset 0 0 30px rgba(255, 255, 255, 0.5);
            cursor: pointer;
            font-size: 1.3rem;
            font-weight: 900;
            color: white;
            text-shadow: 0 0 10px black, 0 0 18px #ff00ff;
            letter-spacing: 2px;
            transition: all 0.1s cubic-bezier(0.2, 1.6, 0.4, 1);
            animation: pulseGlow 2s infinite alternate;
            display: flex;
            justify-content: center;
            align-items: center;
            outline: none;
        }

        .clicker-btn:active {
            transform: scale(0.92);
            box-shadow: 0 0 40px #0ff, 0 0 80px #ff00ff, inset 0 0 45px white;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 18px #0ff, 0 0 40px #0af, 0 0 65px #f0f, inset 0 0 22px white; }
            100% { box-shadow: 0 0 35px #0ff, 0 0 75px #f0f, 0 0 105px #0af, inset 0 0 38px white; }
        }

        .hint {
            color: #8ab8ff;
            font-size: 0.65rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.7;
        }

        .score-panel.pop {
            transform: scale(1.08);
            transition: transform 0.05s;
        }

        .upgrade-panel {
            margin-top: 4px;
            padding: 10px 16px;
            background: rgba(10, 5, 25, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 0, 255, 0.35);
            border-radius: 18px;
            box-shadow: 0 0 18px rgba(255, 0, 255, 0.25), inset 0 0 12px rgba(0, 255, 255, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        .upgrade-info {
            font-size: 0.7rem;
            color: #b0d8ff;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-align: center;
        }

        .upgrade-info b {
            color: #0ff;
            text-shadow: 0 0 8px cyan;
        }

        .upgrade-btn {
            width: 100%;
            padding: 10px 12px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #fff;
            background: linear-gradient(135deg, #2a0a3a, #0a1a3a);
            border: 2px solid #f0f;
            border-radius: 40px;
            cursor: pointer;
            text-shadow: 0 0 8px #f0f, 0 0 14px #0ff;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.4), inset 0 0 15px rgba(0, 255, 255, 0.15);
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .upgrade-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #3a0a5a, #0a2a5a);
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.7), inset 0 0 20px rgba(0, 255, 255, 0.3);
            color: #fff;
            text-shadow: 0 0 12px #f0f, 0 0 22px #0ff;
        }

        .upgrade-btn:active:not(:disabled) {
            transform: scale(0.97);
        }

        .upgrade-btn:disabled {
            opacity: 0.5;
            border-color: #555;
            box-shadow: none;
            text-shadow: none;
            color: #aaa;
            cursor: not-allowed;
        }

        .progress-bar-wrap {
            width: 100%;
            height: 6px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(0, 255, 255, 0.25);
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #0ff, #f0f, #0ff);
            background-size: 200% 100%;
            border-radius: 10px;
            transition: width 0.3s ease;
            box-shadow: 0 0 12px #0ff, 0 0 20px #f0f;
            animation: shiftGradient 2s linear infinite;
        }

        @keyframes shiftGradient {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        .level-badge {
            font-size: 0.7rem;
            color: #f0f;
            letter-spacing: 2px;
            text-shadow: 0 0 8px #f0f;
            font-weight: 700;
        }

        /* индикатор сохранения */
        .save-indicator {
            position: fixed;
            top: 12px;
            right: 12px;
            font-size: 0.6rem;
            color: #0ff;
            letter-spacing: 1px;
            text-transform: uppercase;
            opacity: 0;
            transition: opacity 0.3s ease;
            text-shadow: 0 0 8px cyan;
            z-index: 50;
            pointer-events: none;
        }

        .save-indicator.show {
            opacity: 1;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-overlay.active { display: flex; }

        .modal-content {
            background: #0b0b1f;
            border: 2px solid #0ff;
            border-radius: 24px;
            padding: 28px 32px;
            max-width: 380px;
            margin: 16px;
            text-align: center;
            box-shadow: 0 0 50px #0ff, 0 0 100px #f0f;
            color: #d0f0ff;
        }

        .modal-content h2 {
            font-size: 1.6rem;
            margin-bottom: 14px;
            text-shadow: 0 0 16px cyan;
        }

        .modal-content p {
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .modal-close {
            background: transparent;
            border: 2px solid #0ff;
            color: #0ff;
            padding: 9px 28px;
            font-size: 0.9rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 2px;
            transition: 0.2s;
        }

        .modal-close:hover {
            background: #0ff;
            color: #000;
            box-shadow: 0 0 30px #0ff;
        }
    </style>
</head>
<body>

    <canvas id="particleCanvas"></canvas>
    <div class="save-indicator" id="saveIndicator">💾 сохранено</div>

    <div class="game-container">
        <div class="menu">
            <button class="menu-btn" id="resetBtn">Сброс</button>
            <button class="menu-btn" id="aboutBtn">О игре</button>
            <button class="menu-btn" id="rainbowBtn">Вспышка</button>
        </div>

        <div class="score-panel" id="scoreDisplay">0</div>

        <button class="clicker-btn" id="clickerButton">ЖМИ</button>

        <div class="hint" id="clickValueLabel">+1 за клик</div>

        <div class="upgrade-panel">
            <div class="upgrade-info" id="upgradeInfo">
                Улучшение: <b id="nextUpgradeCost">4</b> кликов
            </div>
            <div class="progress-bar-wrap">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
            <button class="upgrade-btn" id="upgradeBtn" disabled>Улучшить</button>
            <div class="level-badge" id="levelBadge">УРОВЕНЬ 1 · +1</div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <h2>⚡ НЕОН КЛИКЕР ⚡</h2>
            <p>Кликай по кнопке и набивай счёт.<br>
            Внизу — кнопка улучшения. Чем больше накликаешь, тем сильнее станет каждый клик.<br>
            Улучшения требуют: 4 → 8 → 16 → 32 → ... кликов.<br>
            <b>Прогресс сохраняется автоматически!</b></p>
            <button class="modal-close" id="modalCloseBtn">Закрыть</button>
        </div>
    </div>

    <script>
        (function() {
            // ---------- CANVAS ЧАСТИЦ ----------
            const canvas = document.getElementById('particleCanvas');
            const ctx = canvas.getContext('2d');
            let width, height;

            function resizeCanvas() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            let particles = [];
            const NEON_COLORS = [
                '#00ffff', '#ff00ff', '#ff44aa', '#aa88ff',
                '#00ffcc', '#ffaa00', '#ff3366', '#88ddff'
            ];

            function createParticles(x, y, count = 18, isBig = false) {
                const baseCount = isBig ? count * 2 : count;
                for (let i = 0; i < baseCount; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 1.5 + Math.random() * 5.5;
                    const vx = Math.cos(angle) * speed * (0.8 + Math.random() * 0.7);
                    const vy = Math.sin(angle) * speed * (0.8 + Math.random() * 0.7);
                    const color = NEON_COLORS[Math.floor(Math.random() * NEON_COLORS.length)];
                    const size = 3 + Math.random() * 7;
                    const life = 0.7 + Math.random() * 0.8;
                    particles.push({
                        x, y, vx, vy, size, color,
                        life, maxLife: life,
                        flicker: 0.7 + Math.random() * 0.5
                    });
                }
            }

            function createFlash() {
                const cx = width / 2, cy = height / 2;
                createParticles(cx, cy, 60, true);
                for (let i = 0; i < 25; i++) {
                    createParticles(Math.random() * width, Math.random() * height, 4);
                }
            }

            function updateParticles() {
                ctx.clearRect(0, 0, width, height);
                if (particles.length === 0) {
                    requestAnimationFrame(updateParticles);
                    return;
                }
                ctx.globalCompositeOperation = 'lighter';
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.life -= 0.016;
                    if (p.life <= 0) { particles.splice(i, 1); continue; }
                    p.x += p.vx; p.y += p.vy;
                    p.vx *= 0.985; p.vy *= 0.985; p.vy += 0.08;
                    const lifeRatio = p.life / p.maxLife;
                    const currentSize = p.size * lifeRatio * 1.2;
                    const alpha = lifeRatio * p.flicker;
                    const flickerAlpha = alpha * (0.9 + 0.2 * Math.sin(Date.now() * 0.02 + p.x));

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, currentSize * 1.8, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = flickerAlpha * 0.25;
                    ctx.fill();

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, currentSize * 0.9, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = flickerAlpha;
                    ctx.fill();

                    if (p.size > 6 && Math.random() > 0.7) {
                        ctx.beginPath();
                        ctx.arc(p.x + (Math.random() - 0.5) * 8, p.y + (Math.random() - 0.5) * 8, currentSize * 0.4, 0, Math.PI * 2);
                        ctx.fillStyle = '#ffffff';
                        ctx.globalAlpha = flickerAlpha * 0.9;
                        ctx.fill();
                    }
                }
                ctx.globalAlpha = 1.0;
                ctx.globalCompositeOperation = 'source-over';
                requestAnimationFrame(updateParticles);
            }
            updateParticles();

            // ---------- ЭЛЕМЕНТЫ ----------
            const scoreDisplay = document.getElementById('scoreDisplay');
            const clickerButton = document.getElementById('clickerButton');
            const resetBtn = document.getElementById('resetBtn');
            const aboutBtn = document.getElementById('aboutBtn');
            const rainbowBtn = document.getElementById('rainbowBtn');
            const modalOverlay = document.getElementById('modalOverlay');
            const modalCloseBtn = document.getElementById('modalCloseBtn');

            const upgradeBtn = document.getElementById('upgradeBtn');
            const nextUpgradeCostEl = document.getElementById('nextUpgradeCost');
            const progressBar = document.getElementById('progressBar');
            const levelBadge = document.getElementById('levelBadge');
            const clickValueLabel = document.getElementById('clickValueLabel');
            const upgradeInfo = document.getElementById('upgradeInfo');
            const saveIndicator = document.getElementById('saveIndicator');

            // ---------- СОСТОЯНИЕ ----------
            let score = 0;
            let clicksPerClick = 1;
            let level = 1;
            let upgradeCost = 4;

            // ---------- СОХРАНЕНИЕ (localStorage) ----------
            const SAVE_KEY = 'neonClickerSave_v1';

            function saveGame() {
                try {
                    const data = {
                        score: score,
                        clicksPerClick: clicksPerClick,
                        level: level,
                        upgradeCost: upgradeCost,
                        timestamp: Date.now()
                    };
                    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
                    showSaveIndicator();
                } catch (e) {
                    console.warn('Не удалось сохранить:', e);
                }
            }

            function loadGame() {
                try {
                    const raw = localStorage.getItem(SAVE_KEY);
                    if (!raw) return false;
                    const data = JSON.parse(raw);
                    // валидация
                    if (typeof data.score !== 'number') return false;

                    score = Math.max(0, Math.floor(data.score));
                    clicksPerClick = Math.max(1, Math.floor(data.clicksPerClick || 1));
                    level = Math.max(1, Math.floor(data.level || 1));
                    upgradeCost = Math.max(1, Math.floor(data.upgradeCost || 4));

                    // защита от рассинхронизации
                    if (clicksPerClick !== level) clicksPerClick = level;

                    return true;
                } catch (e) {
                    console.warn('Не удалось загрузить сохранение:', e);
                    return false;
                }
            }

            function clearSave() {
                try {
                    localStorage.removeItem(SAVE_KEY);
                } catch (e) {}
            }

            let saveTimeout = null;
            function showSaveIndicator() {
                saveIndicator.classList.add('show');
                clearTimeout(saveTimeout);
                saveTimeout = setTimeout(() => {
                    saveIndicator.classList.remove('show');
                }, 900);
            }

            // отложенное сохранение, чтобы не спамить localStorage на каждый клик
            let saveDebounce = null;
            function scheduleSave() {
                clearTimeout(saveDebounce);
                saveDebounce = setTimeout(saveGame, 250);
            }

            // ---------- UI ----------
            function updateUI() {
                scoreDisplay.textContent = score;
                levelBadge.textContent = `УРОВЕНЬ ${level} · +${clicksPerClick}`;
                clickValueLabel.textContent = `+${clicksPerClick} за клик`;

                nextUpgradeCostEl.textContent = upgradeCost;
                const canUpgrade = score >= upgradeCost;
                upgradeBtn.disabled = !canUpgrade;
                upgradeBtn.textContent = canUpgrade 
                    ? `Улучшить (${upgradeCost})` 
                    : `Нужно ${upgradeCost}`;

                const progress = Math.min(score, upgradeCost) / upgradeCost * 100;
                progressBar.style.width = progress + '%';

                if (canUpgrade) {
                    upgradeBtn.style.borderColor = '#0ff';
                    upgradeInfo.style.color = '#fff';
                } else {
                    upgradeBtn.style.borderColor = '#f0f';
                }
            }

            function popScore() {
                scoreDisplay.classList.add('pop');
                setTimeout(() => scoreDisplay.classList.remove('pop'), 80);
            }

            // ---------- КЛИК ----------
            clickerButton.addEventListener('click', () => {
                score += clicksPerClick;
                updateUI();
                popScore();
                scheduleSave();

                const rect = clickerButton.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                createParticles(cx, cy, 18 + Math.min(clicksPerClick * 3, 30), false);

                clickerButton.style.transform = 'scale(0.92)';
                setTimeout(() => clickerButton.style.transform = '', 80);
            });

            // ---------- УЛУЧШЕНИЕ ----------
            upgradeBtn.addEventListener('click', () => {
                if (score < upgradeCost) return;

                score -= upgradeCost;
                level += 1;
                clicksPerClick = level;
                upgradeCost = upgradeCost * 2;

                updateUI();
                saveGame(); // сохраняем сразу после улучшения

                const rect = upgradeBtn.getBoundingClientRect();
                createParticles(rect.left + rect.width / 2, rect.top + rect.height / 2, 40, true);
                createFlash();
            });

            // ---------- СБРОС ----------
            resetBtn.addEventListener('click', () => {
                if (!confirm('Сбросить весь прогресс? Это действие нельзя отменить.')) return;
                score = 0;
                clicksPerClick = 1;
                level = 1;
                upgradeCost = 4;
                updateUI();
                clearSave();
                particles = [];
                createParticles(width / 2, height / 2, 30, false);
                popScore();
                showSaveIndicator();
            });

            // ---------- ВСПЫШКА ----------
            rainbowBtn.addEventListener('click', () => {
                createFlash();
                scoreDisplay.classList.add('pop');
                setTimeout(() => scoreDisplay.classList.remove('pop'), 100);
            });

            // ---------- МОДАЛКА ----------
            aboutBtn.addEventListener('click', () => modalOverlay.classList.add('active'));
            modalCloseBtn.addEventListener('click', () => modalOverlay.classList.remove('active'));
            modalOverlay.addEventListener('click', (e) => {
                if (e.target === modalOverlay) modalOverlay.classList.remove('active');
            });

            // ---------- СОХРАНЕНИЕ ПРИ ВЫХОДЕ ----------
            window.addEventListener('beforeunload', () => {
                saveGame();
            });
            // на всякий случай (мобильные браузеры)
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'hidden') saveGame();
            });

            // периодическое автосохранение (страховка)
            setInterval(saveGame, 10000);

            // ---------- СТАРТ ----------
            const loaded = loadGame();
            updateUI();

            if (!loaded) {
                // первый запуск
                setTimeout(() => createParticles(width / 2, height / 2, 35, false), 200);
            } else {
                // небольшой эффект при загрузке сохранения
                setTimeout(() => {
                    createParticles(width / 2, height / 2, 25, false);
                }, 150);
                saveIndicator.textContent = '💾 загружено';
                showSaveIndicator();
                setTimeout(() => {
                    saveIndicator.textContent = '💾 сохранено';
                }, 1200);
            }
        })();
    </script>
</body>
  </html>
